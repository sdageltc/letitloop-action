name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features & Capabilities'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes & Hardening'
    labels:
      - 'bug'
      - 'fix'
  - title: '🛡️ Security & Sandboxing'
    labels:
      - 'security'
  - title: '📚 Documentation & Integration'
    labels:
      - 'documentation'
change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
template: |
  ## What's Changed
  $CHANGES

  **Full Changelog**: https://github.com/sdageltc/letitloop-action/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
